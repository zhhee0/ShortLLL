server:
  port: 8001

spring:
  application:
    name: short-link-project
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${PROJECT_REDIS_PASSWORD:your_project_redis_password}
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: short-link-stats-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

short-link:
  kafka:
    stats-topic: short-link.stats
    stats-dlt-topic: short-link.stats.DLT
    partitions: 3
    replicas: 1
    retry:
      interval: 1000
      max-attempts: 3
  domain:
    default: heng.beimxw.top
  stats:
    locale:
      amap-key: ${PROJECT_AMAP_KEY:your_project_amap_key}
  goto-domain:
    white-list:
      enable: true
      names: 'offer,zhihu,juejin,cnblogs'
      details:
        - nageoffer.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
