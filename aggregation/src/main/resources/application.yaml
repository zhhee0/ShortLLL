server:
  port: 8003

spring:
  application:
    name: short-link-aggregation
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${AGGREGATION_REDIS_PASSWORD:your_aggregation_redis_password}
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: short-link-stats-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

aggregation:
  remote-url: http://127.0.0.1:${server.port}

short-link:
  kafka:
    stats-topic: short-link.stats
    stats-dlt-topic: short-link.stats.DLT
    partitions: 3
    replicas: 1
    retry:
      interval: 1000
      max-attempts: 3
  group:
    max-num: 20
  flow-limit:
    enable: true
    time-window: 1
    max-access-count: 20
  domain:
    default: heng.beimxw.top
  demo-mode:
    enable: false
    blacklist:
      - /api/short-link/admin/v1/group
      - /api/short-link/admin/v1/recycle-bin/remove
      - /api/short-link/admin/v1/create
      - /api/short-link/admin/v1/create/batch
      - /api/short-link/admin/v1/update
      - /api/short-link/admin/v1/user
      - /api/short-link/admin/v1/user/logout
      - /api/short-link/admin/v1/recycle-bin/save
  stats:
    locale:
      amap-key: ${AGGREGATION_AMAP_KEY:your_aggregation_amap_key}
  goto-domain:
    white-list:
      enable: false
      names: 'offer,zhihu,juejin,cnblogs'
      details:
        - nageoffer.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: ${spring.application.name}
